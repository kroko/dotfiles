# kroko

# ################################################################
# General ref
# https://github.com/rothgar/awesome-tmux

# ################################################################
# Notes as of 2024-05
# Current terminal Alacritty https://github.com/alacritty/alacritty (was iTerm)
# After years of resistance OPT key IS set as ALT key
# That means that all Latvian diacritics are achieved using dead key (')
# Thus this conf USES M-*

# My chosen approach is
# DO NOT unbind much of default tmux shortcuts / keep defaults alive
# ADD bindings on top

# ref default bindings
# https://man7.org/linux/man-pages/man1/tmux.1.html#DEFAULT_KEY_BINDINGS
# https://gist.github.com/mzmonsour/8791835

# ################################################################

unbind C-r
bind C-r source-file ~/.tmux.conf \; display "Config reloaded"

# add prefix as C-space (keep default C-b)
set-option -g prefix C-Space

# lower escape time
set-option -sg escape-time 50

# loosen repeatable command timeouts
set-option -g repeat-time 1000

# history limit
set-option -g history-limit 5000

# enable focus events so that we can use some hooks later on
set-option -g focus-events on

# highlight window when it has new activity
set-window-option -g monitor-activity on
set-option -g visual-activity on

# ################################################################
# Mouse
# ################################################################

# enable mouse
# on macos this
# enables scrolling while multiple panes (no need to enter zoom and copy mode)
# enables pane activation on click
# enables pane resizing
# enables window activation on click
set-window-option -g mouse on

# ################################################################
# Session, window opening, closing, renaming
# ################################################################

# apart from default behaviour add that
# pane create / quit / select     -> ..   / x       / multiple opts
# window create / quit / select   -> c    / X (&)   / w
# session create / quit / select  -> C    / C-k     / s

# when killing session, do not exit tmux, switch to next
set-option -g detach-on-destroy off

# for default close shortcuts skip conformation
bind & kill-window
bind x kill-pane

# bind C-k to kill session
unbind C-k
bind C-k kill-session

# bind X to kill window
unbind X
bind X kill-window

# keep c to new window
# nothing to do

# keep w to list windows
# nothing to do

# keep n/p to listswitch to next/prev window
# nothing to do

# bind C to new session
unbind C
bind C command-prompt "new-session -A -s %%"

# bind R to rename session (keep default prefix + $)
unbind R
bind R command-prompt "rename-session %%"

# bind r to rename window (keep default prefix + ,)
unbind r
bind r command-prompt "rename-window %%"


# ################################################################
# Copy mode
# ################################################################

# in copy mode set vi
set-window-option -g mode-keys vi

# ################################################################
# Panes
# ################################################################

# show pane numbering for longer
# set-option -g display-panes-time 2000

# show pane numbering until chosen
bind -T prefix q display-panes -d 0

# bind splitting panes to these extras, and keep cwd
# unbind \\
# unbind -
bind \\ split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# bind movement between panes to vi style and make repeatable (keep default prefix + o)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# bind same vi style to growing/shrinking panes and make repeatable
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# bind space as repeatable (OVERRIDE fefault)
unbind " "
bind -r " " next-layout

# even along x or y
bind C-h select-layout even-horizontal
bind C-v select-layout even-vertical

# swap-pane (keep defaults)
# bind-key { swap-pane -U
# bind-key } swap-pane -D
# bind-key C-o rotate-window

# ################################################################
# Numbering
# ################################################################

#start window index at 1
set-option -g base-index 1

# start pane index at 1
set-window-option -g pane-base-index 1

# re-number windows when closing any
set-option -g renumber-windows on

# ################################################################
# Pane styling
# ################################################################

# set pane-border-format ..
set-option -g pane-border-indicators colour
set-option -g pane-border-lines single
set-option -g pane-border-status top
set-option -g pane-active-border-style bg=colour2,fg=colour0,bold
set-option -g pane-border-style bg=default,fg=default

# active/inactive pane bg changes
# currently back to default colors, use brders for viusal aid
set-hook -g pane-focus-out 'select-pane -P bg=default,fg=default'
set-hook -g pane-focus-in 'select-pane -P bg=default,fg=default'
# set-hook -g client-focus-in "set window-active-style 'fg=...,bg=...'"
# set-hook -g client-focus-out "set window-active-style 'fg=...,bg=...'"

# ################################################################
# Status Bar
# ################################################################

# default tmux status bar is black on green

# keep bottom
set-option -g status-position bottom

# set refresh interval for status bar
set-option -g status-interval 30

# center the status bar
set-option -g status-justify left

# color status bar, use new and old notation to force
# set-window-option -g window-status-current-style bg=colour234,fg=green

# do not add bg for status bar, as we also use multiline trick to add padding
set-window-option -g status-style bg=default,fg=default

# legacy, use status-style
# set-option -g status-fg colour15
# set-option -g status-bg colour8

set-window-option -g status-left-length 40
# show session name, pane/total panes, window in left status bar
set-window-option -g status-left '#[fg=colour2]#{session_name} #[fg=colour3]#{pane_index}/#{window_panes} #[default]'
# show hostname, ISO date, time, using strftime
set-window-option -g status-right '#[fg=colour6]#{host} #[default]%Y-%d-%m %H:%M'

# add space between promt and status bar at the bottom
# https://github.com/tmux/tmux/issues/1886#issuecomment-525382148
set-option -Fg 'status-format[1]' '#{status-format[0]}'
set-option -g 'status-format[0]' ''
set-option -g status 2

# ################################################################
# Title
# ################################################################

# dynamically update title
set-option -g set-titles on

# but don't change tmux's own window titles, use self named
set-option -w -g automatic-rename off

set-option -g set-titles-string "#T : #h > #S > #W"

# ################################################################
# OS specific
# ################################################################

# load OS specific stuff
if-shell 'uname | grep -q Darwin' \
    'source-file ~/.tmux.macos.conf' \
    'source-file ~/.tmux.linux.conf'
    # 'if-shell "uname | grep -q CYGWIN" "source-file ~/.tmux.cygwin.conf" "source-file ~/.tmux.linux.conf"'

